# Full surveyHelper stack: `cp .env.example .env`, set ONE provider key, then `docker compose up -d`.
# Brings up pgvector Postgres (schema auto-applied), the worker, the MCP server, and the daily
# proactive-scan scheduler. Verify it works: `docker compose run --rm worker surveyhelper-verify`.

x-app-env: &app-env
  SURVEYHELPER_DSN: postgresql://surveyhelper:surveyhelper@db:5432/surveyhelper
  SURVEYHELPER_LLM_BACKEND: ${SURVEYHELPER_LLM_BACKEND:-auto}   # auto picks the provider whose key is set
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: surveyhelper
      POSTGRES_PASSWORD: surveyhelper
      POSTGRES_DB: surveyhelper
    volumes:
      - sh_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro   # applied on first init
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveyhelper -d surveyhelper"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "surveyhelper.worker"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build: .
    command: ["surveyhelper-mcp"]
    ports:
      - "${SURVEYHELPER_MCP_PORT:-8765}:8765"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    command: ["python", "-m", "surveyhelper.scheduler"]   # enqueues proactive_scan daily
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sh_pgdata:
