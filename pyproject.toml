[project]
name = "surveyhelper"
version = "0.1.0"
description = "Local research companion + OpenClaw plugin: per-paper analysis, citation-graph synthesis, personal memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "feedparser>=6.0", # arXiv Atom API
    "pymupdf>=1.24", # PDF full-text for pre-HTML papers
    "fastembed>=0.3", # local embeddings (onnx, no torch) — 384d bge-small
    "starlette>=1.2.1",
    "anthropic>=0.69", # portable LLM backend (API key); the `cli` backend needs no key
    "openai>=1.40", # optional LLM backend (SURVEYHELPER_LLM_BACKEND=openai)
    "google-genai>=0.3", # optional LLM backend (SURVEYHELPER_LLM_BACKEND=gemini)
]

[project.optional-dependencies]
# DuckDB is an optional read-only analytics/eval companion (Phase 8). It is NOT
# needed by the core system (which queries Postgres directly). Cross-tested:
# premature for live dashboards (slower + a runtime extension fetch), but the right
# tool for golden-set eval where it joins a CSV/parquet against Postgres natively.
analytics = ["duckdb>=1.5.3"]

[project.scripts]
surveyhelper-mcp = "surveyhelper.mcp_server:main"
surveyhelper-scan = "surveyhelper.scan:main"
surveyhelper-scheduler = "surveyhelper.scheduler:main"
surveyhelper-verify = "surveyhelper.selftest:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "duckdb>=1.5.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surveyhelper"]
